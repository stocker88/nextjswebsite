name: Deploy legal pages only
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: github-pages
    env:
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable && yarn install --frozen-lockfile
      - name: Build only the six legal pages
        run: node scripts/partial/legal.cjs
      - name: Record unchanged production homepage
        run: curl --fail --silent --show-error https://www.stockstobuynow.ai/ -o /tmp/home-before.html
      - name: Deploy legal version on existing routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.168.0 versions upload --config wrangler.legal.jsonc --tag "legal-${GITHUB_RUN_ID}"
          npx --yes wrangler@4.168.0 versions deploy --config wrangler.legal.jsonc --version-tag "legal-${GITHUB_RUN_ID}" --percentage 100 --yes
      - name: Verify legal pages are live
        run: |
          python3 - <<'PY'
          import json, subprocess, re
          home=subprocess.check_output(['curl','-fsSL','https://www.stockstobuynow.ai/'],text=True)
          build=lambda html: json.loads(re.search(r'<script[^>]*id="__NEXT_DATA__"[^>]*>(.*?)</script>',html).group(1))['buildId']
          assert build(home)==build(open('/tmp/home-before.html').read()),'Homepage build changed unexpectedly'
          routes=['legal/']+['legal/'+p['slug']+'/' for p in json.load(open('data/legal-disclosures.json'))]
          for route in routes:
            result=subprocess.check_output(['curl','--retry','4','--retry-all-errors','--fail','--silent','--show-error','https://www.stockstobuynow.ai/'+route],text=True)
            assert 'https://www.stockstobuynow.ai/'+route in result
            assert 'Draft for review' not in result
            print('Verified live:',route)
          sitemap=subprocess.check_output(['curl','-fsSL','https://www.stockstobuynow.ai/sitemap.xml'],text=True)
          assert 'https://www.stockstobuynow.ai/sitemaps/legal.xml' in sitemap
          print('Verified homepage unchanged and legal sitemap registered')
          PY
