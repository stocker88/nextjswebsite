name: Deploy current website to GitHub Pages
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [article_published]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXT_PUBLIC_APPLE_PROVIDER_TOKEN: ${{ vars.APPLE_PROVIDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - run: yarn test:content-access
      - run: yarn test:membership
      - run: node scripts/account-devices-check.cjs
      - run: node scripts/account-linking-check.cjs
      - run: yarn test:seo
      - run: node scripts/option-result-pages-check.cjs
      - run: node scripts/article-posts-check.cjs
      - run: node scripts/mover-headlines-check.cjs
      - run: node scripts/mover-trades-check.cjs
      - run: node scripts/mover-context-check.cjs
      - run: node scripts/default-market-view-check.cjs
      - run: node scripts/heatmap-default-view-check.cjs
      - run: node scripts/macro-check.cjs
      - name: Restore sentiment cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fear-greed
          key: fear-greed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fear-greed-v1-
      - name: Refresh sentiment when due
        id: sentiment
        run: node scripts/sync-fear-greed.cjs
      - name: Preserve sentiment snapshot and attempt date
        if: steps.sentiment.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fear-greed
          key: fear-greed-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore macro history and refresh schedule
        uses: actions/cache/restore@v4
        with:
          path: .cache/macro
          key: macro-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: macro-v1-
      - name: Refresh due macro series and reconcile history monthly
        id: macro
        run: node scripts/sync-macro.cjs
      - name: Preserve macro history and attempt dates
        if: always() && steps.macro.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache/macro
          key: macro-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: yarn build:pages
      - run: node scripts/github-pages/verify.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
  submit-search-console:
    name: Submit public sitemaps
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sitemap: [sitemap.xml, news-sitemap.xml, video-sitemap.xml]
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_OAUTH_JSON: ${{ secrets.GSC_OAUTH_JSON }}
      GSC_SITE_URL: sc-domain:stockstobuynow.ai
      GSC_SITEMAP_URL: https://www.stockstobuynow.ai/${{ matrix.sitemap }}
    steps:
      - uses: actions/checkout@v4
      - name: Submit the deployed sitemap
        if: env.GSC_SERVICE_ACCOUNT_JSON != '' || env.GSC_OAUTH_JSON != ''
        run: node scripts/submit-google-news-sitemap.cjs
      - name: Explain one-time setup when credentials are absent
        if: env.GSC_SERVICE_ACCOUNT_JSON == '' && env.GSC_OAUTH_JSON == ''
        run: echo "Search Console submission is ready but needs the GSC_OAUTH_JSON or GSC_SERVICE_ACCOUNT_JSON repository secret."
