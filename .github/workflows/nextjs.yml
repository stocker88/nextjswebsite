name: Deploy current website
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [article_published]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_APPLE_PROVIDER_TOKEN: ${{ vars.APPLE_PROVIDER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/configure-pages@v5
        if: vars.WEBSITE_HOST != 'cloudflare'
      - run: yarn test:content-access
      - run: node scripts/academy-check.cjs
      - run: node scripts/academy-lessons-check.cjs
      - run: yarn test:profile-onboarding
      - run: yarn test:localization
      - run: node scripts/conversion-localization-check.cjs
      - run: yarn test:membership
      - run: node scripts/account-devices-check.cjs
      - run: node scripts/account-linking-check.cjs
      - run: node scripts/seo-tools-check.cjs
      - run: node scripts/comparison-coverage-check.cjs
      - run: node scripts/crypto-prediction-check.cjs
      - run: node scripts/prediction-events-check.cjs
      - run: node scripts/prediction-periods-check.cjs
      - run: node scripts/prediction-export-check.cjs
      - run: yarn test:seo
      - run: node scripts/option-result-pages-check.cjs
      - run: node scripts/options-check.cjs
      - run: node scripts/article-posts-check.cjs
      - run: node scripts/mover-headlines-check.cjs
      - run: node scripts/mover-trades-check.cjs
      - run: node scripts/mover-context-check.cjs
      - run: node scripts/default-market-view-check.cjs
      - run: node scripts/heatmap-default-view-check.cjs
      - run: node scripts/macro-check.cjs
      - run: node scripts/ipo-calendar-check.cjs
      - name: Restore IPO weekly snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/ipo
          key: ipo-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ipo-v1-
      - name: Refresh IPO calendar when weekly update is due
        run: node scripts/sync-ipo-calendar.cjs
      - name: Save IPO snapshot and retry state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/ipo
          key: ipo-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore sentiment cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fear-greed
          key: fear-greed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fear-greed-v1-
      - name: Refresh sentiment when due
        id: sentiment
        run: node scripts/sync-fear-greed.cjs
      - name: Preserve sentiment snapshot and attempt date
        if: steps.sentiment.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fear-greed
          key: fear-greed-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore macro history and refresh schedule
        uses: actions/cache/restore@v4
        with:
          path: .cache/macro
          key: macro-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: macro-v1-
      - name: Refresh due macro series and reconcile history monthly
        id: macro
        run: node scripts/sync-macro.cjs
      - name: Preserve macro history and attempt dates
        if: always() && steps.macro.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache/macro
          key: macro-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore daily crypto history
        uses: actions/cache/restore@v4
        with:
          path: .cache/crypto
          key: crypto-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: crypto-history-v1-
      - name: Refresh additional crypto history when due
        run: node scripts/sync-crypto-history.cjs
      - name: Save daily crypto history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/crypto
          key: crypto-history-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore company research snapshots
        uses: actions/cache/restore@v4
        with:
          path: .cache/earnings
          key: earnings-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: earnings-v1-
      - name: Restore IWV research and refresh dates
        uses: actions/cache/restore@v4
        with:
          path: .cache/iwv
          key: iwv-research-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: iwv-research-v1-
      - name: Refresh a bounded batch of IWV company research
        run: node scripts/sync-iwv-research.cjs
      - name: Preserve IWV research and retry dates
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/iwv
          key: iwv-research-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare compressed export storage
        run: bash scripts/github-pages/prepare-build-volume.sh
      - run: yarn build:pages
      - name: Preserve company research snapshots
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/earnings
          key: earnings-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: node scripts/github-pages/verify.cjs
      - run: node scripts/localization/export-check.cjs
      - run: node scripts/public-investor-pages-check.cjs
      - uses: actions/upload-pages-artifact@v3
        if: vars.WEBSITE_HOST != 'cloudflare'
        with:
          path: out
      - name: Reuse embedded prediction data to reduce asset count
        if: vars.WEBSITE_HOST == 'cloudflare'
        run: node scripts/compact-prediction-export.cjs && node scripts/pack-localized-predictions.cjs
      - name: Check Cloudflare asset limits and SEO routing
        if: vars.WEBSITE_HOST == 'cloudflare'
        run: node scripts/cloudflare-check.cjs
      - name: Package Cloudflare static export
        if: vars.WEBSITE_HOST == 'cloudflare'
        run: tar -czf /tmp/cloudflare-site.tar.gz -C out .
      - uses: actions/upload-artifact@v4
        if: vars.WEBSITE_HOST == 'cloudflare'
        with:
          name: cloudflare-site
          path: /tmp/cloudflare-site.tar.gz
          compression-level: 0
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        if: vars.WEBSITE_HOST != 'cloudflare'
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
        if: vars.WEBSITE_HOST == 'cloudflare'
      - uses: actions/setup-node@v4
        if: vars.WEBSITE_HOST == 'cloudflare'
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        if: vars.WEBSITE_HOST == 'cloudflare'
        with:
          name: cloudflare-site
          path: /tmp/cloudflare-site
      - name: Prepare compressed deployment storage
        if: vars.WEBSITE_HOST == 'cloudflare'
        run: bash scripts/github-pages/prepare-build-volume.sh
      - name: Extract verified export
        if: vars.WEBSITE_HOST == 'cloudflare'
        run: mkdir -p "$WEBSITE_EXPORT_VOLUME/out" && ln -s "$WEBSITE_EXPORT_VOLUME/out" out && tar -xzf /tmp/cloudflare-site/cloudflare-site.tar.gz -C out
      - name: Deploy Cloudflare static assets
        if: vars.WEBSITE_HOST == 'cloudflare'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.168.0 deploy --config wrangler.jsonc
  submit-search-console:
    name: Submit public sitemaps
    needs: deploy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sitemap: [sitemap.xml, news-sitemap.xml, video-sitemap.xml]
    env:
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_OAUTH_JSON: ${{ secrets.GSC_OAUTH_JSON }}
      GSC_SITE_URL: sc-domain:stockstobuynow.ai
      GSC_SITEMAP_URL: https://www.stockstobuynow.ai/${{ matrix.sitemap }}
    steps:
      - uses: actions/checkout@v4
      - name: Submit the deployed sitemap
        if: env.GSC_SERVICE_ACCOUNT_JSON != '' || env.GSC_OAUTH_JSON != ''
        run: node scripts/submit-google-news-sitemap.cjs
      - name: Explain one-time setup when credentials are absent
        if: env.GSC_SERVICE_ACCOUNT_JSON == '' && env.GSC_OAUTH_JSON == ''
        run: echo "Search Console submission is ready but needs the GSC_OAUTH_JSON or GSC_SERVICE_ACCOUNT_JSON repository secret."
