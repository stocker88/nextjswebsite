name: Deploy current website to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - uses: actions/configure-pages@v5
      - run: yarn test:seo
      - name: Restore sentiment cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/fear-greed
          key: fear-greed-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fear-greed-v1-
      - name: Refresh sentiment when due
        id: sentiment
        run: node scripts/sync-fear-greed.cjs
      - name: Preserve sentiment snapshot and attempt date
        if: steps.sentiment.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .cache/fear-greed
          key: fear-greed-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - run: yarn build:pages
      - run: node scripts/github-pages/verify.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
